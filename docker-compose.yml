services:
  base-de-donnees:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pace
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: ${PACE_DATABASE_PASSWORD:?PACE_DATABASE_PASSWORD est obligatoire}
    volumes:
      - donnees-postgresql:/var/lib/postgresql/data
    networks:
      - donnees
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  connecteur-garmin:
    build:
      context: ./garmin-connector
    restart: unless-stopped
    environment:
      PACE_GARMIN_CLE_SERVICE: ${PACE_CONNECTOR_API_TOKEN:?PACE_CONNECTOR_API_TOKEN est obligatoire}
      PACE_GARMIN_CLE_CHIFFREMENT_BASE64: ${PACE_CONNECTOR_ENCRYPTION_KEY:?PACE_CONNECTOR_ENCRYPTION_KEY est obligatoire}
      PACE_GARMIN_CONNECTEUR_ACTIF: ${PACE_CONNECTOR_ENABLED:-false}
      PACE_GARMIN_FICHIER_SESSION: /donnees/session.enc
    volumes:
      - sessions-garmin:/donnees
    networks:
      - garmin-interne
      - sortie-garmin
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/interne/v1/sante', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      base-de-donnees:
        condition: service_healthy
      connecteur-garmin:
        condition: service_healthy
    environment:
      PACE_DATABASE_URL: jdbc:postgresql://base-de-donnees:5432/pace
      PACE_DATABASE_USER: pace
      PACE_DATABASE_PASSWORD: ${PACE_DATABASE_PASSWORD:?PACE_DATABASE_PASSWORD est obligatoire}
      PACE_GARMIN_CONNECTOR_URL: http://connecteur-garmin:8081
      PACE_GARMIN_CONNECTOR_TOKEN: ${PACE_CONNECTOR_API_TOKEN:?PACE_CONNECTOR_API_TOKEN est obligatoire}
      PACE_API_ACCESS_TOKEN: ${PACE_API_ACCESS_TOKEN:?PACE_API_ACCESS_TOKEN est obligatoire}
      PACE_AI_API_KEY: ${PACE_AI_API_KEY:-}
      PACE_AI_MODEL: ${PACE_AI_MODEL:-gpt-5.6-luna}
    networks:
      - application
      - donnees
      - garmin-interne
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"

  application-web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PACE_ACCESS_PASSWORD: ${PACE_ACCESS_PASSWORD:?PACE_ACCESS_PASSWORD est obligatoire}
      PACE_API_ACCESS_TOKEN: ${PACE_API_ACCESS_TOKEN:?PACE_API_ACCESS_TOKEN est obligatoire}
    networks:
      - application
    ports:
      - "${PACE_LISTEN_ADDRESS:-127.0.0.1}:${PACE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/sante"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:size=1m,noexec,nosuid,uid=101,gid=101,mode=0750
      - /var/cache/nginx:size=16m,noexec,nosuid,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

volumes:
  donnees-postgresql:
  sessions-garmin:

networks:
  application:
  donnees:
    internal: true
  garmin-interne:
    internal: true
  # Accès HTTPS sortant du seul connecteur. Une liste blanche de domaines doit
  # être appliquée au pare-feu ou au mandataire sortant du NAS.
  sortie-garmin:
