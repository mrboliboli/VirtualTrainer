[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pace-garmin-connector"
version = "0.1.0"
description = "Connecteur Garmin personnel, local et en lecture seule pour Pace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "garminconnect==0.3.11",
  "pydantic-settings==2.10.1",
  "slowapi==0.1.9",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pace_garmin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pace_garmin"]

[[tool.mypy.overrides]]
module = "garminconnect"
ignore_missing_imports = true
